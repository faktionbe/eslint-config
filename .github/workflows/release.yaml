name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish packages on main (uses npm Trusted Publishing for release.yaml)
        type: boolean
        default: true

# Reset permissions; each job declares exactly what it needs.
permissions: {}

# Avoid two release runs racing each other on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes
      pull-requests: write # open/update the "Version Packages" PR
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2

  publish:
    if: |
      (github.event_name == 'push' && needs.select-mode.outputs.mode == 'publish') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_only)
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # push git tags / create GitHub releases
      id-token: write # npm Trusted Publishing (OIDC) – no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action/publish@v2
        with:
          script: pnpm release
